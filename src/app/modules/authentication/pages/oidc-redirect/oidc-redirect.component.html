<!-- Wait for Processing Message -->
@if (!processed) {
  <div>
    <p><strong>Do not close this window!</strong></p>
    <p>Processing callback ...</p>
  </div>
}
<!-- Successful Message -->
@if (processed && !error) {
  <div>
    <p>You can close this window now.</p>
  </div>
}
<!-- Error Message -->
@if (processed && error) {
  <div>
    <p><strong>Error!</strong></p>
    <p>{{ error }}</p>
  </div>
}
